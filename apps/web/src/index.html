    <style id="theme-colors"></style>
    <script>
      (async function validateServiceWorkerTrack() {
        const cookie = document.cookie.match(/release\-track=([^;]+)/);
        const releaseTrack = cookie ? cookie[1] : "stable";
        const expectedPrefix =
          releaseTrack === "beta" ? "notesnook-beta" : "notesnook";

        const cacheKeys = await caches.keys();
        const mismatched = cacheKeys.some(
          (key) => !key.startsWith(expectedPrefix)
        );

        if (mismatched) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          await Promise.all(cacheKeys.map((key) => caches.delete(key)));
          window.location.reload();
        }
      })();
    </script>
    <script type="module" src="./index.ts"></script>
    <style>
      html {
        overscroll-behavior: none;
      }

      html[data-theme="light"] .react-loading-skeleton {
        --base-color: var(--background-secondary);
        --highlight-color: #var(--background-secondary);
      }

      html[data-theme="dark"] .react-loading-skeleton {
        --base-color: var(--background-secondary);
        --highlight-color: var(--background-secondary);
      }

      #splash {
        background-color: var(--background);
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #splash svg {
        transform: scale(1);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.9);
        }

        70% {
          transform: scale(1);
        }

        100% {
          transform: scale(0.9);
        }
      }

      html,
      body {
        font-size: 16px;
      }

      @media only screen and (max-width: 480px) {
        html,
        body {
          font-size: 18px;
          background-color: var(--background);
        }
      }

      :root,
      body,
      #root {
        margin: 0 !important;
        height: 100%;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      /* svg {
  width: 1.5rem;
} */
      .ReactModal__Overlay {
        opacity: 0;
        transition: opacity 200ms ease-in-out;
      }

      .ReactModal__Overlay--after-open {
        opacity: 1;
      }

      .ReactModal__Overlay--before-close {
        opacity: 0;
      }

      .slide {
        background-color: transparent !important;
      }

      .carousel.carousel-slider {
        display: flex;
        flex-direction: row;
      }
    </style>
  </head>

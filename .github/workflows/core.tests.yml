name: "Test @notesnook/core"

# Upstream ran core's end-to-end suite here, which logs into Notesnook
# Cloud with account secrets. This fork has no cloud account and never
# contacts that infrastructure, so only the unit suite runs — which is
# also why plain `pull_request` replaces `pull_request_target`: with no
# secrets in play, fork PRs need no authorization gate.
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "packages/core/**"
      # re-run workflow if workflow file changes
      - ".github/workflows/core.tests.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "packages/core/**"
      # re-run workflow if workflow file changes
      - ".github/workflows/core.tests.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: ./.github/actions/setup-node-with-cache

      - name: Prepare environment
        run: |
          npm install --ignore-scripts --prefer-offline --no-audit --no-fund
          npm run bootstrap -- --scope=core

      - name: Run the @notesnook/core unit tests
        run: npm run tx @notesnook/core:test
